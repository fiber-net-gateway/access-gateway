{{- if and .Values.accessServer.enabled .Values.monitoring.serviceMonitor.enabled }}
{{- $sm := .Values.monitoring.serviceMonitor -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "fibron.accessServer.fullname" . }}
  namespace: {{ default .Release.Namespace $sm.namespace }}
  labels:
    {{- include "fibron.componentLabels" (dict "root" . "component" "access-server") | nindent 4 }}
    {{- with $sm.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or $sm.annotations .Values.global.commonAnnotations }}
  annotations:
    {{- with .Values.global.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $sm.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "fibron.selectorLabels" (dict "root" . "component" "access-server") | nindent 6 }}
      app.kubernetes.io/metrics: "true"
  endpoints:
    - port: status
      path: /metrics
      scheme: {{ $sm.scheme }}
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      {{- if or $sm.usePodNameAsInstance $sm.relabelings }}
      relabelings:
        {{- if $sm.usePodNameAsInstance }}
        - sourceLabels:
            - __meta_kubernetes_pod_name
          targetLabel: instance
        {{- end }}
        {{- with $sm.relabelings }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
