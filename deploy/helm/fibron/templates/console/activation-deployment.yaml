{{- if and .Values.console.enabled .Values.console.activationCollector.enabled }}
{{- include "fibron.validateConsole" . }}
{{- $c := .Values.console -}}
{{- $ac := $c.activationCollector -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fibron.console.activationName" . }}
  labels:
    {{- include "fibron.componentLabels" (dict "root" . "component" "console-activation") | nindent 4 }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $ac.replicaCount }}
  selector:
    matchLabels:
      {{- include "fibron.selectorLabels" (dict "root" . "component" "console-activation") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fibron.componentLabels" (dict "root" . "component" "console-activation") | nindent 8 }}
        {{- with $ac.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/console/configmap.yaml") . | sha256sum }}
        {{- with .Values.global.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $ac.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fibron.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "fibron.imagePullSecrets" . | nindent 6 }}
      {{- with $ac.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $ac.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: activation-collector
          image: {{ include "fibron.image" (dict "root" . "image" $c.image) }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          command:
            - node
            - server/dist/processes/activation-collector.js
          envFrom:
            - configMapRef:
                name: {{ include "fibron.console.fullname" . }}
            {{- with $ac.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "fibron.console.secretEnv" . | nindent 12 }}
            - name: ACTIVATION_TARGETS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ $ac.existingSecret | quote }}
                  key: {{ $ac.targetsJsonKey | quote }}
            {{- with $ac.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $ac.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ac.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with $ac.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ac.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ac.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
