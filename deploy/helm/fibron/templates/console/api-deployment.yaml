{{- if .Values.console.enabled }}
{{- include "fibron.validateConsole" . }}
{{- $c := .Values.console -}}
{{- $api := $c.api -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fibron.console.apiName" . }}
  labels:
    {{- include "fibron.componentLabels" (dict "root" . "component" "console-api") | nindent 4 }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $api.replicaCount }}
  selector:
    matchLabels:
      {{- include "fibron.selectorLabels" (dict "root" . "component" "console-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fibron.componentLabels" (dict "root" . "component" "console-api") | nindent 8 }}
        {{- with $api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/console/configmap.yaml") . | sha256sum }}
        {{- with .Values.global.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fibron.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "fibron.imagePullSecrets" . | nindent 6 }}
      {{- with $api.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console-api
          image: {{ include "fibron.image" (dict "root" . "image" $c.image) }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          command:
            - node
            - server/dist/index.js
          ports:
            - name: http
              containerPort: {{ $api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "fibron.console.fullname" . }}
            {{- with $api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "fibron.console.secretEnv" . | nindent 12 }}
            {{- with $api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: {{ $api.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ $api.probes.startup.periodSeconds }}
            timeoutSeconds: {{ $api.probes.startup.timeoutSeconds }}
            failureThreshold: {{ $api.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: {{ $api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $api.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: {{ $api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $api.probes.liveness.failureThreshold }}
          {{- with $api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with $api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
