name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    name: Console (Web & Server)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check generated user guide
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build console workspaces
        run: npm run build

  native:
    name: Native (access-server C++23)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 \
            gcc-14 \
            ninja-build \
            perl \
            pkg-config

      - name: Setup CMake 4.1+
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.1.x'

      - name: Cache native FetchContent downloads
        uses: actions/cache@v4
        with:
          path: native/build/_deps
          key: native-deps-${{ runner.os }}-${{ hashFiles('third_party/fiber-gateway-cpp/cmake/Deps.cmake') }}

      - name: Configure native build
        env:
          CC: gcc-14
          CXX: g++-14
        run: npm run configure:native

      - name: Build access-server, validator, and tests
        run: |
          cmake --build native/build \
            --target fiber_app_access_server fiber_app_access_gateway_validator fiber_access_server_tests \
            --parallel "$(nproc)"

      - name: Run focused access-server tests
        run: ctest --test-dir native/build --output-on-failure -L access-server

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose.yaml and compose.prebuilt.yaml
        env:
          MYSQL_ROOT_PASSWORD: ci-dummy-root-password
          MYSQL_PASSWORD: ci-dummy-password
          DOCUMENT_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RNACOS_ADMIN_USERNAME: admin
          RNACOS_ADMIN_PASSWORD: ci-dummy-rnacos-password
          ACCESS_SERVER_ACTIVATION_TOKEN: ci-dummy-activation-token
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.prebuilt.yaml config --quiet

  helm-validate:
    name: Validate Helm Chart
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Grafana dashboards stay synced with Helm chart
        run: npm run helm:check-dashboards

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Lint, render, validate, and package Helm chart
        run: |
          helm lint --strict deploy/helm/fibron -f deploy/helm/fibron/examples/values-eval.yaml
          helm lint --strict deploy/helm/fibron -f deploy/helm/fibron/examples/values-production.yaml
          helm lint --strict deploy/helm/fibron --set console.enabled=false --set 'externalNacos.addresses={10.20.0.10}'

          if helm template test deploy/helm/fibron >/dev/null 2>&1; then
            echo "Expected default values without Secret references to fail rendering" >&2
            exit 1
          fi

          helm template fibron deploy/helm/fibron -n fibron -f deploy/helm/fibron/examples/values-eval.yaml \
            | kubeconform -strict -kubernetes-version 1.31.0 -skip ServiceMonitor
          helm template fibron deploy/helm/fibron -n fibron -f deploy/helm/fibron/examples/values-production.yaml \
            | kubeconform -strict -kubernetes-version 1.31.0 -skip ServiceMonitor
          helm template fibron-edge deploy/helm/fibron -n fibron-edge --set console.enabled=false --set 'externalNacos.addresses={10.20.0.10}' \
            | kubeconform -strict -kubernetes-version 1.31.0 -skip ServiceMonitor

          helm package deploy/helm/fibron -d /tmp
